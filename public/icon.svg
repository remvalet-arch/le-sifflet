<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>

  <!-- VAR bordered box (miroir du logo TopBar) -->
  <rect x="68" y="136" width="376" height="144" rx="20"
        fill="none" stroke="white" stroke-opacity="0.6" stroke-width="14"/>

  <!-- VAR text -->
  <text x="256" y="250"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="112"
        text-anchor="middle"
        fill="white"
        letter-spacing="10">VAR</text>

  <!-- TIME text -->
  <text x="256" y="356"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="68"
        text-anchor="middle"
        fill="white"
        fill-opacity="0.75"
        letter-spacing="20">TIME</text>
</svg>
